<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css?v=4" />

  <body data-page="predictions">
    <header class="site-header">
      <a class="brand" href="index.html"><span class="brand-mark"></span><span>Notts County</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="matches.html">Matches</a>
        <a href="predictions.html" aria-current="page">Predictions</a>
        <a href="ratings.html">Ratings</a>

    <main class="app">
      <section class="hero compact">
        <p class="kicker">crystal ball</p>
        <h1>Predictions</h1>
